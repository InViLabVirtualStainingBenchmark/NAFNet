name: NAFNet-MIST-PR-width64
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: MIST_PR_train
    type: PairedImageDataset
    dataroot_gt: /scratch/antwerpen/212/vsc21216/unified/datasets/MIST/PR/trainB
    dataroot_lq: /scratch/antwerpen/212/vsc21216/unified/datasets/MIST/PR/trainA
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_flip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
  val:
    name: MIST_PR_val
    type: PairedImageDataset
    dataroot_gt: /scratch/antwerpen/212/vsc21216/unified/datasets/MIST/PR/valB
    dataroot_lq: /scratch/antwerpen/212/vsc21216/unified/datasets/MIST/PR/valA
    io_backend:
      type: disk

network_g:
  type: NAFNet
  width: 64
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  experiments_root: /data/antwerpen/212/vsc21216/projects/unified/outputs/nafnet/MIST_PR
  models: /data/antwerpen/212/vsc21216/projects/unified/outputs/nafnet/MIST_PR/checkpoints
  training_states: /data/antwerpen/212/vsc21216/projects/unified/outputs/nafnet/MIST_PR/checkpoints
  log: /data/antwerpen/212/vsc21216/projects/unified/outputs/nafnet/MIST_PR/logs

train:
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: 0.
    betas: [0.9, 0.9]
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 230
    eta_min: !!float 1e-7
  total_iter: 230
  warmup_iter: -1
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

val:
  val_freq: 230
  save_img: false
  use_image: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 230
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500