name: NAFNet-BCI-512-100k-part2
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10
datasets:
  train:
    name: BCI_train
    type: PairedImageDataset
    dataroot_gt: /tmp/bci/train_IHC
    dataroot_lq: /tmp/bci/train_HE
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 512
    use_flip: true
    use_rot: true
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
  val:
    name: BCI_val
    type: PairedImageDataset
    dataroot_gt: /tmp/bci/val_IHC
    dataroot_lq: /tmp/bci/val_HE
    io_backend:
      type: disk
network_g:
  type: NAFNet
  width: 64
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: /code/NAFNet/experiments/NAFNet-BCI-512-100k-part1/training_states/45000.state
  experiments_root: /output
  models: /output/checkpoints
  training_states: /output/checkpoints
  log: /output/logs
train:
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: 0.
    betas: [0.9, 0.9]
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 100000
    eta_min: !!float 1e-7
  total_iter: 100000
  warmup_iter: -1
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean
val:
  val_freq: 5000
  save_img: false
  use_image: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
logger:
  print_freq: 100
  save_checkpoint_freq: 15000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
dist_params:
  backend: nccl
  port: 29500
